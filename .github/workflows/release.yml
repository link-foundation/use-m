name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# actions/checkout runs `git init` before any step could configure Git; this
# sets the default branch for it and silences the "master" hint in every job.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  workflow-lint:
    name: Lint workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The image bundles shellcheck, so every `run:` block is linted too.
      # Pinned by digest; re-resolve when bumping with
      #   docker inspect --format='{{index .RepoDigests 0}}' rhysd/actionlint:<tag>
      # Reproduce locally:
      #   docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: Run actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
        with:
          args: -color

      # Reproduce locally:
      #   pipx run zizmor==1.29.0 --config .github/zizmor.yml --min-confidence low .github/workflows
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v0.6.2
        with:
          advanced-security: false
          annotations: true
          config: .github/zizmor.yml
          min-confidence: low
          version: 1.29.0

  version-check:
    name: Check the package version is unpublished
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          package-manager-cache: false

      # Every merge to main publishes package.json's version. Checking it here
      # fails the pull request instead of the publish job after the merge.
      - name: Check npm version
        run: node scripts/npm-release.mjs check-unpublished

  test:
    name: Test on ${{ matrix.runtime == 'node' && format('Node.js {0}', matrix.node-version) || matrix.runtime }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # The floating Ubuntu label moves to Ubuntu 26 from 2026-10-19 and
        # announced it in a notice on every job
        # (https://github.com/actions/runner-images/issues/14748); the Linux
        # image is pinned so that move is a reviewed change, not a surprise.
        os: [ubuntu-24.04, macos-latest, windows-latest]
        runtime: [node, bun, deno]
        # Every Node.js line users still run: the supported built-in modules are
        # read from the runtime instead of a table inside use-m, so what each
        # Node.js version reports is part of the contract and gets tested.
        node-version: [20.x, 22.x, 24.x]
        exclude:
          # Bun and Deno execute the tests with their own runtime and only need
          # one Node.js to install dependencies with.
          - runtime: bun
            node-version: 22.x
          - runtime: bun
            node-version: 24.x
          - runtime: deno
            node-version: 22.x
          - runtime: deno
            node-version: 24.x

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Setup Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Setup Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        if: matrix.runtime == 'node' && matrix.os == 'ubuntu-24.04' && matrix.node-version == '24.x'
        run: npm audit --omit=dev

      - name: Verify missing fetch through the shebang
        if: matrix.runtime == 'node'
        shell: bash
        run: ./experiments/test-polyfill-no-fetch.mjs

      - name: Run Node.js tests
        if: matrix.runtime == 'node'
        run: npm test -- --runInBand

      - name: Run Bun tests
        if: matrix.runtime == 'bun'
        run: bun test

      - name: Run Deno tests
        if: matrix.runtime == 'deno'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            deno test --allow-net --allow-env --allow-run --allow-read --allow-write --allow-sys && exit 0
            status=$?

            if [ "$attempt" = "3" ]; then
              exit "$status"
            fi

            echo "Deno tests failed on attempt ${attempt}/3; retrying after a short delay."
            sleep $((attempt * 15))
          done

  publish:
    name: Publish to npm
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.test.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write

    steps:
      # Full history: the backfill step checks that the commit npm recorded
      # for a version is on main. Tags and releases are created through the
      # GitHub API, so the checkout keeps no credentials.
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js for release
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # An unreachable registry fails this step instead of being read as "not
      # published" and walking into a publish conflict.
      - name: Check npm version
        id: npm-version
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/npm-release.mjs status

      - name: Stop when this version is already released
        if: steps.npm-version.outputs.exists == 'true'
        env:
          PACKAGE: ${{ steps.npm-version.outputs.name }}@${{ steps.npm-version.outputs.version }}
          TAG: ${{ steps.npm-version.outputs.tag }}
          TAG_EXISTS: ${{ steps.npm-version.outputs.tag_exists }}
          RELEASE_EXISTS: ${{ steps.npm-version.outputs.release_exists }}
        run: |
          if [ "$TAG_EXISTS" = "true" ] && [ "$RELEASE_EXISTS" = "true" ]; then
            echo "::error::${PACKAGE}, git tag ${TAG}, and GitHub release ${TAG} already exist. Update package.json to the next unpublished version before merging to main."
            exit 1
          fi
          echo "${PACKAGE} is on npm but its release metadata is incomplete; skipping npm publish and repairing tag/release."

      # Trusted publishing needs npm 11.5.1 or newer. Node.js 24 bundles it, so
      # this only checks instead of installing npm outside the lockfile.
      - name: Check npm supports trusted publishing
        if: steps.npm-version.outputs.exists == 'false'
        run: |
          node --version
          npm --version
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number)
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              console.error("::error::npm " + process.argv[1] + " cannot publish with trusted publishing; it needs 11.5.1 or newer.")
              process.exit(1)
            }
          ' "$(npm --version)"

      - name: Publish to npm
        if: steps.npm-version.outputs.exists == 'false'
        run: npm publish --access public --provenance

      # npm accepts the upload immediately but serves the version minutes
      # later (8.16.1: 2.6 min, 8.16.2: 5.2 min). Waiting up to 15 minutes
      # keeps that normal delay from skipping the tag and release below.
      - name: Wait for npm to serve the new version
        if: steps.npm-version.outputs.exists == 'false'
        run: node scripts/npm-release.mjs wait --timeout-seconds 900 --interval-seconds 15

      - name: Create git tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/npm-release.mjs release --target "$GITHUB_SHA"

      # Versions a failed run published without a tag or release (8.16.1 and
      # 8.16.2) get them at the commit npm recorded for them.
      - name: Repair tags and releases of earlier versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/npm-release.mjs backfill

  # Single status to watch: fails when any job failed or was cancelled, which
  # includes jobs killed by timeout-minutes. Skipped jobs (publish on pull
  # requests, version-check on main) are expected.
  pipeline-status:
    name: Pipeline status
    if: '!cancelled()'
    needs: [workflow-lint, version-check, test, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail when a required job failed or was cancelled
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$NEEDS_JSON" | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key')
          if [ -n "$failed" ]; then
            echo "::error::Jobs that failed or were cancelled: $(echo "$failed" | paste -sd, -)"
            exit 1
          fi
